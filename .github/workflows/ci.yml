name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint:
    name: PHP lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP files
        run: find . -path ./assets/vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPStan
        run: composer stan

  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPCS
        run: composer lint

  phpunit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: [ '7.4', '8.2' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress
      - name: Run PHPUnit
        run: composer test

  assets:
    name: Minified assets in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # The .min.js/.min.css files are committed (no build step at runtime), so
      # fail if a source change wasn't re-minified with the same pinned settings.
      - name: Re-minify and diff
        run: |
          npm install --no-save terser@5.51.2 clean-css-cli@5.6.3
          for src in assets/js/frontend.js assets/js/admin.js assets/js/admin-copy.js; do
            npx terser "$src" --compress --mangle --toplevel -o "${src%.js}.min.js"
          done
          for css in assets/css/frontend.css assets/css/admin.css; do
            npx cleancss -O2 -o "${css%.css}.min.css" "$css"
          done
          git diff --exit-code -- assets/js/*.min.js assets/css/*.min.css
